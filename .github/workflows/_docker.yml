name: Build and Push Docker

on:
  workflow_call:
    inputs:
      version:
        description: "Version to build (e.g., 1.2.3)"
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Docker image
        id: prep
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ inputs.version }}
        run: |
          DOCKER_IMAGE=${DOCKER_USERNAME}/${GITHUB_REPOSITORY#*/}
          SHORTREF=${GITHUB_SHA::8}
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${SHORTREF}"

          # Only the highest stable version gets the 'latest' tag, so that a backport to an older branch doesn't overwrite it
          HIGHEST_VERSION=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's|.*refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          if [[ "$VERSION" == "$HIGHEST_VERSION" ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "docker_image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./release.dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: VERSION=${{ steps.prep.outputs.version }}
          cache-from: |
            type=registry,ref=${{ steps.prep.outputs.docker_image }}:buildcache-amd64
            type=registry,ref=${{ steps.prep.outputs.docker_image }}:buildcache-arm64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./release.dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.prep.outputs.version }}
          push: false
          cache-from: type=registry,ref=${{ steps.prep.outputs.docker_image }}:buildcache-amd64
          cache-to: type=registry,ref=${{ steps.prep.outputs.docker_image }}:buildcache-amd64,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./release.dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ steps.prep.outputs.version }}
          push: false
          cache-from: type=registry,ref=${{ steps.prep.outputs.docker_image }}:buildcache-arm64
          cache-to: type=registry,ref=${{ steps.prep.outputs.docker_image }}:buildcache-arm64,mode=max
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: zauberzeug/nicegui
          short-description: "Web Based User Interface for Python with Buttons, Dialogs, Markdown, 3D Scenes and Plots"
