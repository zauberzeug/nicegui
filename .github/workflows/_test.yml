name: Test Suite

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions to test"
        required: true
        type: string
      scope:
        description: "JSON array of scopes to run"
        required: true
        type: string

jobs:
  test:
    name: ${{ matrix.python }} / ${{ matrix.scope }}
    strategy:
      matrix:
        python: ${{ fromJson(inputs.python-versions) }}
        scope: ${{ fromJson(inputs.scope) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv python install "$PYTHON_VERSION"
      - name: Install dependencies
        run: uv sync --locked
      - name: ${{ matrix.python }} / ${{ matrix.scope }}
        if: matrix.scope == 'pytest'
        run: uv run pytest
      - name: ${{ matrix.python }} / examples/pytests
        if: matrix.scope == 'pytest'
        run: uv run --project ../.. pytest
        working-directory: examples/pytests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.scope == 'pytest' && failure()
        with:
          name: screenshots-${{ matrix.python }}
          path: |
            screenshots/**/*.failed.png
            examples/pytests/screenshots/**/*.failed.png
          retention-days: 14
      - name: ${{ matrix.python }} / ${{ matrix.scope }}
        if: matrix.scope == 'startup'
        run: ./test_startup.sh
      - name: Restore dependencies for effective caching
        if: matrix.scope == 'startup' && always()
        run: uv sync --locked
